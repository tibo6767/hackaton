<h2 mat-dialog-title>{{ asset.name }}</h2>

<mat-dialog-content>
  <div class="preview">
    @if (imageError()) {
    <span class="placeholder">Aperçu indisponible</span>
    } @else {
    @if (!imageLoaded()) {
    <span class="placeholder">Chargement...</span>
    }
    <img [src]="asset.thumbnail_url" [alt]="asset.name" [class.hidden]="!imageLoaded()"
      (load)="imageLoaded.set(true)" (error)="imageError.set(true)" />
    }
  </div>

  @if (asset.description) {
  <p class="description">{{ asset.description }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Annuler</button>
  <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial>Confirmer</button>
</mat-dialog-actions>
