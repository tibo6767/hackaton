<header class="header">
  <!-- F3D logo: shape from public/logo.svg, colour from CSS -->
  <span class="logo" aria-hidden="true"></span>

  <div class="titles">
    <h1>3D Model Viewer</h1>
    @if (modelName(); as name) {
      <p class="model-name">{{ name | titlecase }}</p>
    }
  </div>

  <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle light/dark theme">
    <!-- Sun in dark mode (click to go light), moon in light mode -->
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</header>
