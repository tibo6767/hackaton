<header class="header">
  <!-- F3D logo (from github.com/f3d-app/f3d, resources/logo-mono.svg) -->
  <svg class="logo" viewBox="-2.5 -5 5 10" aria-hidden="true">
    <path class="filled" d="M2,-4.5 L-2,0.5 L-2,-1.5 L2,-4.5z" />
    <path class="filled" d="M0,-0.5 L2,1.5 L2,-0.5 L0,-0.5z" />
    <path d="M0.4,-0.5 L2,-4.5 L-2,-1.5 L-2,0.5 L-0.4,0.5" />
    <path d="M0,-0.5 L-2,4.5 L2,1.5 L2,-0.5 L0,-0.5z" />
  </svg>

  <div class="titles">
    <h1>3D Model Viewer</h1>
    @if (modelName(); as name) {
      <p class="model-name">{{ name | titlecase }}</p>
    }
  </div>

  <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle light/dark theme">
    @if (isDark()) {
      <!-- Sun: shown in dark mode, click to go light -->
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    } @else {
      <!-- Moon: shown in light mode, click to go dark -->
      <svg viewBox="0 0 24 24">
        <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" />
      </svg>
    }
  </button>
</header>
